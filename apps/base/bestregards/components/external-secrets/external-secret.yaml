# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bestregards
  namespace: bestregards
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store # Override on cluster level
  target:
    name: bestregards-secrets
    creationPolicy: Owner
  data:
    - secretKey: BOT_TOKEN
      remoteRef:
        key: BOT_TOKEN
    - secretKey: SESSION_SECRET
      remoteRef:
        key: SESSION_SECRET
    - secretKey: EVENTS_PEPPER
      remoteRef:
        key: EVENTS_PEPPER
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: WEBHOOK_SECRET
    - secretKey: METRICS_TOKEN
      remoteRef:
        key: METRICS_TOKEN
    - secretKey: AI_API_KEY
      remoteRef:
        key: AI_API_KEY
    # Empty value disables guests; must be set together with TURNSTILE_SITE_KEY in the ConfigMap
    - secretKey: TURNSTILE_SECRET
      remoteRef:
        key: TURNSTILE_SECRET
