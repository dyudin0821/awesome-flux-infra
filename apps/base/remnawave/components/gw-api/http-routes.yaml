# HTTPRoute для subscription page (публичная страница подписок)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: remnawave-subscription-route
  namespace: remnawave
spec:
  parentRefs:
    - name: envoy-public
      namespace: envoy-gateway-system
  hostnames:
    - subscription.${cluster_subdomain}
  rules:
    - backendRefs:
        - name: remnawave-subscription-page
          port: 3010
---
# HTTPRoute для admin panel
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: remnawave-panel-route
  namespace: remnawave
spec:
  parentRefs:
    - name: envoy-public
      namespace: envoy-gateway-system
  hostnames:
    - remnawave.${cluster_subdomain}
  rules:
    - backendRefs:
        - name: remnawave-app
          port: 3000
