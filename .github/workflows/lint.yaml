---
name: Lint

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Setup yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.13.0

      - name: yamlfmt check
        run: yamlfmt -conf .yamlfmt -dry -lint .

      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint .

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
