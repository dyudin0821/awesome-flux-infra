---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Setup yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.13.0

      - name: yamlfmt check
        run: yamlfmt -conf .yamlfmt -dry -lint .

      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint .

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

  validate:
    name: Validate manifests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: fluxcd/pkg/actions/yq@main

      - uses: fluxcd/pkg/actions/kubeconform@main

      - uses: fluxcd/pkg/actions/kustomize@main

      - name: Validate manifests
        run: ./scripts/validate.sh

  diff:
    name: Diff clusters
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: fluxcd/pkg/actions/yq@main

      - uses: fluxcd/pkg/actions/kustomize@main

      - name: Diff clusters
        run: ./scripts/diff.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
