name: Renovate

on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (no PR/branch creation)"
        type: boolean
        default: false
      logLevel:
        description: "Log level"
        type: choice
        options: [info, debug]
        default: info

# Only one run at a time — do not cancel mid-run to avoid orphan branches
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # dry-run mode: 'full' logs all actions without creating PRs
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
