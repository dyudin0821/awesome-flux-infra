apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: remnawave-pg
  namespace: pg-remnawave
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  bootstrap:
    initdb:
      database: remnawave
      owner: remnawave
      secret:
        name: remnawave-pg-app-secret
  storage:
    size: 10Gi
  monitoring:
    enablePodMonitor: true
  managed:
    roles:
      - name: remnawave
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: remnawave-pg-app-secret
