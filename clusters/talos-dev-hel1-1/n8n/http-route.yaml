---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-route
  namespace: n8n
spec:
  parentRefs:
    - name: envoy-public
      namespace: envoy-gateway-system
  hostnames:
    - n8n.${cluster_subdomain}
  rules:
    - backendRefs:
        - name: n8n
          port: 80
