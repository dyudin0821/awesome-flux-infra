---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmagent-route
  namespace: monitoring
spec:
  parentRefs:
    - name: envoy-public
      namespace: envoy-gateway-system
  hostnames:
    - vmagent.${cluster_subdomain}
  rules:
    - backendRefs:
        - name: vmagent-vm-stack-victoria-metrics-k8s-stack
          port: 8429
