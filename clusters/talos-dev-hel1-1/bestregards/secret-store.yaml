apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bestregards-doppler
spec:
  provider:
    doppler:
      project: bestregards
      config: prd
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-bestregards
            namespace: external-secrets
            key: dopplerToken
