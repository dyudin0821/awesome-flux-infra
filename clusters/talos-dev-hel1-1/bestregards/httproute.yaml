apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bestregards
  namespace: bestregards
  labels:
    app.kubernetes.io/name: bestregards
spec:
  parentRefs:
    - name: envoy-public
      namespace: envoy-gateway-system
      sectionName: bestregards
  hostnames:
    - bestregards.portogate.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bestregards
          port: 80
      timeouts:
        request: 60s # an AI call lasts up to 25 s; the service itself cuts a request at 45 s
