apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/bundles/talos-flex
  - envoy-gateway
  #- istio
  - metallb
  - external-secrets
  - external-dns
  - cert-manager
  - victoria-metrics-k8s-stack
  - n8n
  - kubelinks
patches:
  - path: external-dns/helm-release-patch.yaml
    target:
      kind: HelmRelease
      name: external-dns-public
      namespace: external-dns
  - path: metallb/namespace-patch.yaml
    target:
      kind: Namespace
      name: metallb-system
  - path: envoy-gateway/envoyproxy-patch.yaml
    target:
      kind: EnvoyProxy
      name: envoy-public-config
  - path: envoy-gateway/gateway-patch.yaml
    target:
      kind: Gateway
      name: envoy-public
  - path: envoy-gateway/httproute-patch.yaml
    target:
      kind: HTTPRoute
      name: tls-redirect
