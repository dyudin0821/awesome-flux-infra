---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: remnawave-doppler
spec:
  provider:
    doppler:
      project: remnawave
      config: prd
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            namespace: external-secrets
            key: dopplerToken
